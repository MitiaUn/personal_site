<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Project Lakes</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --line-2:rgba(255,255,255,.10);
    --ink:#f1f5f9; --ink-2:#cbd5e1; --ink-3:#94a3b8; --ink-4:#64748b; --ink-5:#475569;
    --land:rgba(255,255,255,.045); --neigh:rgba(255,255,255,.015); --canton:rgba(255,255,255,.07); --border:rgba(255,255,255,.32);
    --water:#16294a; --water-line:#2a4a75; --river:#22395c; --halo:#070b18;
    --done:#0d9488; --done-glow:#5eead4; --todo:#64748b;
    --font:"Inter",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif; --head:"Outfit",var(--font);
    --mono:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,"Liberation Mono","Courier New",monospace;
  }
  *{box-sizing:border-box}
  html,body{margin:0;color:var(--ink);font-family:var(--font);-webkit-font-smoothing:antialiased;background-color:#020617;overflow:hidden}
  .card{position:relative}
  svg.map{display:block;width:100%;height:auto}
  .legend{display:flex;gap:6px;flex-wrap:wrap;align-items:center;padding:6px 2px 0;font-size:12px;color:var(--ink-3)}
  .legend button{appearance:none;background-color:#020617;font:inherit;color:inherit;display:inline-flex;align-items:center;gap:8px;padding:5px 9px;border-radius:9999px;cursor:pointer;border:1px solid transparent;transition:all .2s}
  .legend button:hover{background:rgba(255,255,255,.05);border-color:var(--line-2)}
  .legend button.off{opacity:.35;text-decoration:line-through}
  .legend .sw{width:14px;height:10px;border-radius:3px;display:inline-block;border:1.5px solid transparent}
  .legend .sw.d{background:var(--done);border-color:var(--done-glow);box-shadow:0 0 8px rgba(94,234,212,.6)}
  .legend .sw.t{background:rgba(148,163,184,.12);border-color:var(--ink-3);border-style:dashed}
  .legend .hint{margin-left:auto;color:var(--ink-4);font-size:10px;font-family:var(--mono);letter-spacing:.12em;text-transform:uppercase}
  .tip{position:absolute;pointer-events:none;background:rgba(15,23,42,.92);backdrop-filter:blur(12px);border:1px solid var(--line-2);color:#fff;border-radius:10px;padding:9px 11px;font-size:12.5px;line-height:1.4;max-width:270px;box-shadow:0 10px 30px rgba(0,0,0,.45);opacity:0;transform:translateY(4px);transition:opacity .12s,transform .12s;z-index:5}
  .tip.show{opacity:1;transform:none}
  .tip b{font-family:var(--head);font-size:14px;display:block;margin-bottom:3px;font-weight:600}
  .tip .st{display:inline-block;font-family:var(--mono);font-size:10px;text-transform:uppercase;letter-spacing:.1em;padding:1px 6px;border-radius:4px;margin:2px 0 5px}
  .tip .st.done{background:var(--done)} .tip .st.todo{background:#334155}
  .tip .row{font-family:var(--mono);font-size:11px;color:var(--ink-3)} .tip .row b{display:inline;font:inherit;color:#fff}
  /* lakes */
  .lake{cursor:pointer}
  .lake path.body{stroke-linejoin:round}
  .lake.done path.body{fill:var(--done);fill-opacity:.9;stroke:var(--done-glow);stroke-width:1.1;filter:drop-shadow(0 0 6px rgba(94,234,212,.5))}
  .lake.todo path.body{fill:rgba(148,163,184,.14);stroke:var(--ink-3);stroke-width:1.1;stroke-dasharray:3 2.5}
  .lake text{font-size:10px;fill:var(--ink-2);paint-order:stroke;stroke:var(--halo);stroke-width:3px;stroke-linejoin:round;pointer-events:none;font-weight:600}
  .lake.todo text{fill:var(--ink-3);font-weight:500}
  .lake text.in{fill:#f0fdfa;stroke:rgba(7,11,24,.55);stroke-width:2.5px}
  .lake.hover path.body,.lake.hl path.body{stroke:#fff;stroke-width:1.8;fill-opacity:1}
  .lake.dim{opacity:.15}
  .lake line.leader{stroke:var(--ink-4);stroke-width:.7;opacity:.75}
  .other{fill:var(--water);stroke:var(--water-line);stroke-width:.6}
  .citylabel{font-size:9px;fill:var(--ink-5);pointer-events:none;letter-spacing:.12em;font-family:var(--mono)}
  .city{fill:var(--ink-5)}
</style>
</head>

    </div>
    <div class="tip" id="tip"></div>
  </div>

<script>
(function(){
  const D = JSON.parse(document.getElementById('data').textContent);
  const L = D.lakes;

  const W = 1160, H = 760, PAD = 18;
  const k = Math.cos(46.8*Math.PI/180);
  const bb = {x0:5.93,x1:10.56,y0:45.80,y1:47.82};
  const sx = (W-2*PAD)/((bb.x1-bb.x0)*k), sy = (H-2*PAD)/(bb.y1-bb.y0);
  const S = Math.min(sx, sy);
  const ox = (W - (bb.x1-bb.x0)*k*S)/2, oy = (H - (bb.y1-bb.y0)*S)/2;
  const X = lon => ox + (lon-bb.x0)*k*S;
  const Y = lat => oy + (bb.y1-lat)*S;

  const svg = document.getElementById('map');
  svg.setAttribute('viewBox', `0 0 ${W} ${H}`);
  const NS = 'http://www.w3.org/2000/svg';
  const el = (n, a, parent) => { const e = document.createElementNS(NS, n); for (const q in a) e.setAttribute(q, a[q]); (parent||svg).appendChild(e); return e; };
  function ringPath(r){ return r.map((c,i)=>(i?'L':'M')+X(c[0]).toFixed(1)+' '+Y(c[1]).toFixed(1)).join('')+'Z'; }
  function polyPath(g){
    if (g.type==='Polygon') return g.coordinates.map(ringPath).join('');
    if (g.type==='MultiPolygon') return g.coordinates.map(p=>p.map(ringPath).join('')).join('');
    if (g.type==='GeometryCollection') return g.geometries.map(polyPath).join('');
    return '';
  }
  function linePath(g){
    const one = l => l.map((c,i)=>(i?'L':'M')+X(c[0]).toFixed(1)+' '+Y(c[1]).toFixed(1)).join('');
    if (g.type==='LineString') return one(g.coordinates);
    if (g.type==='MultiLineString') return g.coordinates.map(one).join('');
    return '';
  }

  const defs = el('defs', {});
  const fl = el('filter', {id:'glow', x:'-10%', y:'-10%', width:'120%', height:'120%'}, defs); el('feGaussianBlur', {stdDeviation:14}, fl);
  const cp = el('clipPath', {id:'frame'}, defs); el('rect', {x:0,y:0,width:W,height:H}, cp);
  const chClip = el('clipPath', {id:'chclip'}, defs); el('path', {d:polyPath(D.ch)}, chClip);
  const g0 = el('g', {'clip-path':'url(#frame)'});
  el('path', {d:polyPath(D.neigh), fill:'var(--neigh)'}, g0);
  el('path', {d:polyPath(D.ch), fill:'rgba(94,234,212,.05)', filter:'url(#glow)'}, g0);
  el('path', {d:polyPath(D.ch), fill:'var(--land)'}, g0);
  const gc = el('g', {'clip-path':'url(#chclip)'}, g0);
  D.cantons.forEach(c => el('path', {d:polyPath(c.g), fill:'none', stroke:'var(--canton)', 'stroke-width':.8}, gc));
  D.rivers.forEach(r => el('path', {d:linePath(r.g), fill:'none', stroke:'var(--river)', 'stroke-width':1.1, 'stroke-linejoin':'round', 'stroke-linecap':'round'}, gc));
  D.other.forEach(l => el('path', {d:polyPath(l.g), class:'other'}, g0));
  el('path', {d:polyPath(D.ch), fill:'none', stroke:'var(--border)', 'stroke-width':1.4, 'stroke-linejoin':'round'}, g0);

  const cities = [['Genève',46.204,6.143],['Lausanne',46.520,6.633],['Bern',46.948,7.447],['Basel',47.559,7.588],['Zürich',47.377,8.541],['Luzern',47.050,8.306],['St. Gallen',47.424,9.377],['Chur',46.850,9.532],['Lugano',46.005,8.951],['Sion',46.233,7.360]];
  const gcity = el('g', {});
  const boxes = [];
  cities.forEach(([n,la,lo]) => {
    el('rect', {x:X(lo)-2.2,y:Y(la)-2.2,width:4.4,height:4.4,class:'city',transform:`rotate(45 ${X(lo)} ${Y(la)})`}, gcity);
    el('text', {x:X(lo)+6,y:Y(la)+3.5,class:'citylabel'}, gcity).textContent = n.toUpperCase();
    boxes.push({x:X(lo)-3,y:Y(la)-8,w:8+n.length*6.4,h:14});
  });

  // ---- lakes
  const gl = el('g', {});
  const nodes = {};
  const hit = (a,b) => !(a.x+a.w<b.x || b.x+b.w<a.x || a.y+a.h<b.y || b.y+b.h<a.y);
  const placed = [];
  const fontW = s => s.length*5.5, h = 11;
  L.forEach(p => {
    p.x = X(p.cx); p.y = Y(p.cy);
    const g = el('g', {class:`lake ${p.status}`, 'data-key':p.key}, gl);
    p.path = el('path', {d:polyPath(p.g), class:'body'}, g);
    nodes[p.key] = g;
  });
  // bounding boxes of lake shapes (so labels stay off other lakes)
  L.forEach(p => { try { const b = p.path.getBBox(); p.bb = {x:b.x,y:b.y,w:b.width,h:b.height}; } catch(e) { p.bb = {x:p.x-20,y:p.y-10,w:40,h:20}; } });
  const bigInside = new Set(['Lac Léman','Lac de Neuchâtel','Bodensee','Lago Maggiore']);
  // labels: biggest first
  [...L].sort((a,b)=>b.area-a.area).forEach(p => {
    const g = nodes[p.key], w = fontW(p.name);
    if (bigInside.has(p.key)) {
      // inside the lake, along its long axis roughly: use representative point
      const t = el('text', {x:p.x.toFixed(1), y:(p.y+3.5).toFixed(1), 'text-anchor':'middle', class:'in'}, g); t.textContent = p.name;
      placed.push({x:p.x-w/2-1,y:p.y-h+4,w:w+2,h:h+1}); p.labeled = true; return;
    }
    const others = L.filter(q=>q!==p).map(q=>q.bb);
    // projected vertices of the shape, for support points
    const verts = [];
    const walk = g => { if (g.type==='Polygon') g.coordinates[0].forEach(c=>verts.push([X(c[0]),Y(c[1])])); else if (g.type==='MultiPolygon') g.coordinates.forEach(pp=>pp[0].forEach(c=>verts.push([X(c[0]),Y(c[1])]))); };
    walk(p.g);
    const support = rad => { const dx=Math.cos(rad), dy=-Math.sin(rad); let best=null, bv=-1e9; for (const v of verts){ const d=v[0]*dx+v[1]*dy; if (d>bv){bv=d;best=v;} } return best; };
    const cands = [];
    for (const dist of [5, 12, 20, 30, 42, 56]) for (let a=0;a<360;a+=15) {
      const rad = a*Math.PI/180, sp = support(rad);
      const ex = sp[0] + Math.cos(rad)*dist, ey = sp[1] - Math.sin(rad)*dist;
      const an = Math.cos(rad) > .3 ? 'start' : Math.cos(rad) < -.3 ? 'end' : 'middle';
      cands.push([ex, ey, an, dist, rad, sp]);
    }
    for (const [lx,ly,an,dist,rad,sp] of cands) {
      const bx = an==='start'? lx+2 : an==='end'? lx-2-w : lx-w/2;
      const by = ly + (an==='middle' ? (Math.sin(rad)>0 ? -2 : h+2) : 3.8);
      const box = {x:bx-1,y:by-h+1,w:w+2,h:h+1};
      if (box.x<2||box.y<2||box.x+box.w>W-2||box.y+box.h>H-2) continue;
      if (placed.some(b=>hit(b,box)) || boxes.some(b=>hit(b,box)) || others.some(b=>hit(b,box))) continue;
      if (dist > 12) el('line', {x1:sp[0].toFixed(1), y1:sp[1].toFixed(1), x2:lx.toFixed(1), y2:ly.toFixed(1), class:'leader'}, g);
      const t = el('text', {x:(an==='start'?lx+2:an==='end'?lx-2:lx).toFixed(1), y:by.toFixed(1), 'text-anchor':an}, g); t.textContent = p.name;
      placed.push(box); p.labeled = true; break;
    }
    if (!p.labeled) console.log('unlabeled', p.name);
  });

  // ---- count
  const nd = L.filter(p=>p.status==='done').length, N = L.length;
  document.getElementById('count').textContent = `${nd} / ${N} complete · ${Math.round(nd/N*100)}%`;
  document.querySelectorAll('#legend button').forEach(b => { if (!L.some(p=>p.status===b.dataset.s)) b.style.display='none'; });

  // ---- interaction
  const tip = document.getElementById('tip'), card = svg.parentElement;
  const statusName = {done:'Done', todo:'Remaining'};
  function showTip(p, evt){
    const rows = [];
    if (p.year) rows.push(`<div class="row">ridden <b>${p.year}</b></div>`);
    if (p.dist) rows.push(`<div class="row">loop <b>${p.dist} km</b>${p.elev?` · <b>${p.elev.toLocaleString('en-US')} m</b> climbing`:''}</div>`);
    tip.innerHTML = `<b>${p.name}</b><span class="st ${p.status}">${statusName[p.status]}</span>${p.rank?` <span class="row">· #${p.rank} by size</span>`:''}${rows.join('')}`;
    tip.classList.add('show'); moveTip(evt);
  }
  function moveTip(evt){
    const r = card.getBoundingClientRect();
    let x = evt.clientX - r.left + 14, y = evt.clientY - r.top + 14;
    if (x + tip.offsetWidth > r.width - 8) x = evt.clientX - r.left - tip.offsetWidth - 14;
    if (y + tip.offsetHeight > r.height - 8) y = evt.clientY - r.top - tip.offsetHeight - 14;
    tip.style.left = x+'px'; tip.style.top = y+'px';
  }
  const hideTip = () => tip.classList.remove('show');
  L.forEach(p => {
    const g = nodes[p.key];
    g.addEventListener('mouseenter', e => { g.classList.add('hover'); g.parentNode.appendChild(g); showTip(p, e); });
    g.addEventListener('mousemove', moveTip);
    g.addEventListener('mouseleave', () => { g.classList.remove('hover'); hideTip(); });
  });
  const on = {done:true, todo:true};
  document.querySelectorAll('#legend button').forEach(b => b.addEventListener('click', () => {
    const s = b.dataset.s; on[s] = !on[s]; b.classList.toggle('off', !on[s]);
    L.forEach(p => nodes[p.key].style.display = on[p.status] ? '' : 'none');
  }));

  document.addEventListener('pointerdown', e => {
    if (!e.target.closest('.lake') && !e.target.closest('.pass') && !e.target.closest('.peak') && !e.target.closest('#legend')) {
      hideTip();
    }
  });
})();
</script>
</body>
</html>
