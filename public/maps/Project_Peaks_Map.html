  *{box-sizing:border-box}
  html,body{margin:0;color:var(--ink);font-family:var(--font);-webkit-font-smoothing:antialiased;background-color:#020617;overflow:hidden}
  .card{position:relative}
  svg.map{display:block;width:100%;height:auto}
  .legend{display:flex;gap:6px;flex-wrap:wrap;align-items:center;padding:6px 2px 0;font-size:12px;color:var(--ink-3)}
  .legend button{appearance:none;background-color:#020617;font:inherit;color:inherit;display:inline-flex;align-items:center;gap:8px;padding:5px 9px;border-radius:9999px;cursor:pointer;border:1px solid transparent;transition:all .2s}
  .legend button:hover{background:rgba(255,255,255,.05);border-color:var(--line-2)}
  .legend button.off{opacity:.35;text-decoration:line-through}
  .legend .sw{width:12px;height:11px;display:inline-block;clip-path:polygon(50% 0,100% 100%,0 100%)}
  .legend .sw.d{background:var(--done-glow)}
  .legend .sw.t{background:var(--ink-3)}
  .legend .hint{margin-left:auto;color:var(--ink-4);font-size:10px;font-family:var(--mono);letter-spacing:.12em;text-transform:uppercase}
  .tip{position:absolute;pointer-events:none;background:rgba(15,23,42,.92);backdrop-filter:blur(12px);border:1px solid var(--line-2);color:#fff;border-radius:10px;padding:9px 11px;font-size:12.5px;line-height:1.4;max-width:280px;box-shadow:0 10px 30px rgba(0,0,0,.45);opacity:0;transform:translateY(4px);transition:opacity .12s,transform .12s;z-index:5}
  .tip.show{opacity:1;transform:none}
  .tip b{font-family:var(--head);font-size:14px;display:block;margin-bottom:3px;font-weight:600}
  .tip .st{display:inline-block;font-family:var(--mono);font-size:10px;text-transform:uppercase;letter-spacing:.1em;padding:1px 6px;border-radius:4px;margin:2px 0 5px}
  .tip .st.done{background:var(--done)} .tip .st.todo{background:#334155}
  .tip .row{font-family:var(--mono);font-size:11px;color:var(--ink-3)} .tip .row b{display:inline;font:inherit;color:#fff}
  /* peaks */
  .peak{cursor:pointer}
  .peak path.tri{stroke-linejoin:round}
  .peak.done path.tri{fill:var(--done);stroke:var(--done-glow);stroke-width:1.2;filter:drop-shadow(0 0 5px rgba(94,234,212,.55))}
  .peak.todo path.tri{fill:var(--halo);stroke:var(--todo);stroke-width:1.5}
  .peak path.halo{fill:transparent}
  .peak text{font-size:10px;fill:var(--ink-3);paint-order:stroke;stroke:var(--halo);stroke-width:3px;stroke-linejoin:round;pointer-events:none;font-weight:500}
  .peak.done text{fill:#e2e8f0;font-weight:600}
  .peak.todo text{fill:var(--ink-4)}
  .peak.hover path.tri,.peak.hl path.tri{stroke:#fff;stroke-width:2}
  .peak.dim{opacity:.12}
  .peak line.leader{stroke:var(--ink-3);stroke-width:.8;opacity:.85}
  .lakelabel{font-size:9.5px;fill:#3f6795;font-style:italic;pointer-events:none}
  .citylabel{font-size:9px;fill:var(--ink-5);pointer-events:none;letter-spacing:.12em;font-family:var(--mono)}
  .city{fill:var(--ink-5)}
  .grouplabel{font-size:9px;fill:rgba(148,163,184,.55);letter-spacing:.2em;text-transform:uppercase;font-family:var(--mono);pointer-events:none}
  .inset-title{font-size:9px;fill:var(--ink-4);letter-spacing:.14em;text-transform:uppercase;font-family:var(--mono)}
</style>

  // ---- peaks (triangles)
  const R = h => 4.2 + (Math.min(Math.max(h,4000),4650)-4000)/650*3.3;   // half-width 5 → 9 px
  const tri = (x,y,r) => `M${x} ${(y-r*1.05).toFixed(1)}L${(x+r).toFixed(1)} ${(y+r*0.75).toFixed(1)}L${(x-r).toFixed(1)} ${(y+r*0.75).toFixed(1)}Z`;
  const gp = el('g', {});
  const nodes = {};
  const inFrame = p => p.x>=0 && p.x<=W && p.y>=0 && p.y<=H;
  P.forEach(p => { p.x = M.X(p.lon); p.y = M.Y(p.lat); p.r = R(p.h); });
  const main = P.filter(inFrame), out = P.filter(p=>!inFrame(p));
  main.forEach(p => boxes.push({x:p.x-p.r-2,y:p.y-p.r-2,w:2*p.r+4,h:2*p.r+4}));
  const hit = (a,b) => !(a.x+a.w<b.x || b.x+b.w<a.x || a.y+a.h<b.y || b.y+b.h<a.y);
  const placed = [];
  const fontW = s => s.length*5.35, h = 11;
  main.forEach(p => {
    const g = el('g', {class:`peak ${p.status}`, 'data-key':p.key}, gp);
    el('path', {d:tri(p.x,p.y,Math.max(p.r+6,11)), class:'halo'}, g);
    el('path', {d:tri(p.x,p.y,p.r), class:'tri'}, g);
    nodes[p.key] = g;
  });
  const order = [...main].filter(p=>p.status==='done' || p.major).sort((a,b)=> (b.status==='done')-(a.status==='done') || b.h-a.h);
  function segHitsBox(x1,y1,x2,y2,b){ for (let t=0;t<=1;t+=.1){ const x=x1+(x2-x1)*t, y=y1+(y2-y1)*t; if (x>=b.x&&x<=b.x+b.w&&y>=b.y&&y<=b.y+b.h) return true; } return false; }
  order.forEach(p => {
    const g = nodes[p.key], w = fontW(p.label);
    const own = boxes.find(b => b.x===p.x-p.r-2 && b.y===p.y-p.r-2);
    const cands = [[p.x+p.r+4, p.y+3.8, 'start'], [p.x-p.r-4, p.y+3.8, 'end'], [p.x, p.y-p.r-4, 'middle'], [p.x, p.y+p.r+10, 'middle']];
    for (const [x,y,an] of cands) {
      const bx = an==='start'? x : an==='end'? x-w : x-w/2;
      const box = {x:bx-1,y:y-h+1,w:w+2,h:h+1};
      if (box.x<2||box.y<2||box.x+box.w>W-2||box.y+box.h>H-2) continue;
      const big = {x:box.x-6,y:box.y-5,w:box.w+12,h:box.h+10};
      if (placed.some(b=>hit(b,box)) || boxes.some(b=>hit(b,box)) || boxes.some(b=>b!==own && hit(b,big))) continue;
      el('text', {x:x.toFixed(1), y:y.toFixed(1), 'text-anchor':an}, g).textContent = p.label;
      placed.push(box); p.labeled = true; break;
    }
    if (p.labeled) return;
    const dirs = []; for (let a=0;a<360;a+=10) dirs.push(a*Math.PI/180);
    outer: for (const dist of [14, 20, 27, 35, 44, 54]) for (const a of dirs) {
      const lx = p.x + Math.cos(a)*dist, ly = p.y - Math.sin(a)*dist;
      const an = Math.cos(a) > .3 ? 'start' : Math.cos(a) < -.3 ? 'end' : 'middle';
      const bx = an==='start'? lx+2 : an==='end'? lx-2-w : lx-w/2;
      const by = ly + (an==='middle' ? (Math.sin(a)>0 ? -2 : h+2) : 3.8);
      const box = {x:bx-1,y:by-h+1,w:w+2,h:h+1};
      if (box.x<2||box.y<2||box.x+box.w>W-2||box.y+box.h>H-2) continue;
      const big = {x:box.x-4,y:box.y-3,w:box.w+8,h:box.h+6};
      if (placed.some(b=>hit(b,box)) || boxes.some(b=>hit(b,box))) continue;
      if (dist < 30 && boxes.some(b=>b!==own && hit(b,big))) continue;
      if (boxes.some(b => b!==own && segHitsBox(p.x,p.y,lx,ly,b))) continue;
      el('line', {x1:(p.x+Math.cos(a)*(p.r+1.5)).toFixed(1), y1:(p.y-Math.sin(a)*(p.r+1.5)).toFixed(1), x2:lx.toFixed(1), y2:ly.toFixed(1), class:'leader'}, g);
      el('text', {x:(an==='start'?lx+2:an==='end'?lx-2:lx).toFixed(1), y:by.toFixed(1), 'text-anchor':an}, g).textContent = p.label;
      placed.push(box); p.labeled = true; break outer;
    }
    if (p.labeled) return;
    // relaxed pass for summits that must carry a name: leaders may cross neighbours
    outer2: for (const dist of [18, 26, 36, 48, 62, 78]) for (const a of dirs) {
      const lx = p.x + Math.cos(a)*dist, ly = p.y - Math.sin(a)*dist;
      const an = Math.cos(a) > .3 ? 'start' : Math.cos(a) < -.3 ? 'end' : 'middle';
      const bx = an==='start'? lx+2 : an==='end'? lx-2-w : lx-w/2;
      const by = ly + (an==='middle' ? (Math.sin(a)>0 ? -2 : h+2) : 3.8);
      const box = {x:bx-1,y:by-h+1,w:w+2,h:h+1};
      if (box.x<2||box.y<2||box.x+box.w>W-2||box.y+box.h>H-2) continue;
      if (placed.some(b=>hit(b,box)) || boxes.some(b=>hit(b,box))) continue;
      el('line', {x1:(p.x+Math.cos(a)*(p.r+1.5)).toFixed(1), y1:(p.y-Math.sin(a)*(p.r+1.5)).toFixed(1), x2:lx.toFixed(1), y2:ly.toFixed(1), class:'leader'}, g);
      el('text', {x:(an==='start'?lx+2:an==='end'?lx-2:lx).toFixed(1), y:by.toFixed(1), 'text-anchor':an}, g).textContent = p.label;
      placed.push(box); p.labeled = true; break outer2;
    }
    if (!p.labeled) console.log('unlabeled', p.name);
  });

  // ---- inset: whole Switzerland with the frame and the out-of-frame peaks (Piz Bernina)
  const IW = 440, IH = 260, IX = 14, IY = 14;
  const gi = el('g', {});
  el('rect', {x:IX, y:IY, width:IW, height:IH, rx:10, fill:'rgba(2,6,23,.55)', stroke:'var(--line-2)'}, gi);
  const ipr = proj({x0:5.93,x1:10.56,y0:45.80,y1:47.82}, IW-32, IH-48, IX+16, IY+34);
  const ip = pathFns(ipr);
  el('path', {d:ip.poly(D.ch), fill:'rgba(255,255,255,.06)', stroke:'rgba(255,255,255,.35)', 'stroke-width':1}, gi);
  const fx0 = ipr.X(D.frame.x0), fx1 = ipr.X(D.frame.x1), fy0 = ipr.Y(D.frame.y1), fy1 = ipr.Y(D.frame.y0);
  el('rect', {x:fx0, y:fy0, width:fx1-fx0, height:fy1-fy0, fill:'rgba(94,234,212,.08)', stroke:'var(--done-glow)', 'stroke-width':1, 'stroke-dasharray':'3 2'}, gi);
  el('text', {x:IX+12, y:IY+16, class:'inset-title'}, gi).textContent = `${main.length} of ${P.length} summits in the framed area`;
  out.forEach(p => {
    const x = ipr.X(p.lon), y = ipr.Y(p.lat);
    const g = el('g', {class:`peak ${p.status}`, 'data-key':p.key}, gi);
    el('path', {d:tri(x,y,Math.max(p.r,9)), class:'halo'}, g);
    el('path', {d:tri(x,y,6.5), class:'tri'}, g);
    el('text', {x:x+11, y:y+4, 'text-anchor':'start'}, g).textContent = `${p.name} · ${p.h} m`;
    nodes[p.key] = g;
  });

  // ---- count
  const nd = P.filter(p=>p.status==='done').length, N = P.length;
  document.getElementById('count').textContent = `${nd} / ${N} complete · ${Math.round(nd/N*100)}%`;
  document.querySelectorAll('#legend button').forEach(b => { if (!P.some(p=>p.status===b.dataset.s)) b.style.display='none'; });

  // ---- interaction
  const tip = document.getElementById('tip'), card = svg.parentElement;
  const statusName = {done:'Done', todo:'Remaining'};
  function showTip(p, evt){
    const rows = [];
    if (p.year) rows.push(`<div class="row">summited <b>${p.year}</b>${p.type?` · ${p.type.toLowerCase()}`:''}</div>`);
    if (p.grade) rows.push(`<div class="row">grade <b>${p.grade}</b>${p.gain?` · <b>${p.gain.toLocaleString('en-US')} m</b> gain`:''}</div>`);
    if (p.note) rows.push(`<div class="row">${p.note}</div>`);
    tip.innerHTML = `<b>${p.name}</b><span class="st ${p.status}">${statusName[p.status]}</span> <span class="row">· ${p.h.toLocaleString('en-US')} m · ${p.group} · #${p.rank} of 48</span>${rows.join('')}`;
    tip.classList.add('show'); moveTip(evt);
  }
  function moveTip(evt){
    const r = card.getBoundingClientRect();
    let x = evt.clientX - r.left + 14, y = evt.clientY - r.top + 14;
    if (x + tip.offsetWidth > r.width - 8) x = evt.clientX - r.left - tip.offsetWidth - 14;
    if (y + tip.offsetHeight > r.height - 8) y = evt.clientY - r.top - tip.offsetHeight - 14;
    tip.style.left = x+'px'; tip.style.top = y+'px';
  }
  const hideTip = () => tip.classList.remove('show');
  P.forEach(p => {
    [nodes[p.key], nodes[p.key+'@d']].filter(Boolean).forEach(g => {
      const twin = () => [nodes[p.key], nodes[p.key+'@d']].filter(Boolean);
      g.addEventListener('mouseenter', e => { twin().forEach(x=>{x.classList.add('hover'); x.parentNode.appendChild(x);}); showTip(p, e); });
      g.addEventListener('mousemove', moveTip);
      g.addEventListener('mouseleave', () => { twin().forEach(x=>x.classList.remove('hover')); hideTip(); });
    });
  });
  const on = {done:true, todo:true};
  document.querySelectorAll('#legend button').forEach(b => b.addEventListener('click', () => {
    const s = b.dataset.s; on[s] = !on[s]; b.classList.toggle('off', !on[s]);
    P.forEach(p => [nodes[p.key], nodes[p.key+'@d']].filter(Boolean).forEach(g => g.style.display = on[p.status] ? '' : 'none'));
  }));

  document.addEventListener('pointerdown', e => {
    if (!e.target.closest('.lake') && !e.target.closest('.pass') && !e.target.closest('.peak') && !e.target.closest('#legend')) {
      hideTip();
    }
  });
})();
</script>
</body>
</html>
