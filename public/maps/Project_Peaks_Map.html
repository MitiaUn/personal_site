<style>
  :root{
    --line:rgba(255,255,255,.06); --line-2:rgba(255,255,255,.10);
    --ink:#f1f5f9; --ink-2:#cbd5e1; --ink-3:#94a3b8; --ink-4:#64748b; --ink-5:#475569;
    --land:rgba(255,255,255,.045); --neigh:rgba(255,255,255,.015); --canton:rgba(255,255,255,.07); --border:rgba(255,255,255,.32);
    --water:#16294a; --water-line:#2a4a75; --river:#22395c; --halo:#070b18;
    --done:#0d9488; --done-glow:#5eead4; --todo:#64748b;
    --font:"Inter",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif; --head:"Outfit",var(--font);
    --mono:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,"Liberation Mono","Courier New",monospace;
  }
  *{box-sizing:border-box}
  html,body{margin:0;color:var(--ink);font-family:var(--font);-webkit-font-smoothing:antialiased;background-color:#020617;overflow:hidden}
  svg.map{display:block;width:100%;height:auto}
  .legend{display:flex;gap:6px;flex-wrap:wrap;align-items:center;padding:6px 2px 0;font-size:12px;color:var(--ink-3)}
  .legend button{appearance:none;background:transparent;font:inherit;color:inherit;display:inline-flex;align-items:center;gap:8px;padding:5px 9px;border-radius:9999px;cursor:pointer;border:1px solid transparent;transition:all .2s}
  .legend button:hover{background:rgba(255,255,255,.05);border-color:var(--line-2)}
  .legend button.off{opacity:.35;text-decoration:line-through}
  .legend .sw{width:12px;height:11px;display:inline-block;clip-path:polygon(50% 0,100% 100%,0 100%)}
  .legend .sw.d{background:var(--done-glow)} .legend .sw.t{background:var(--ink-3)}
  .count{margin-left:auto;color:var(--ink-4);font-size:10px;font-family:var(--mono);letter-spacing:.12em;text-transform:uppercase}
  .top{display:flex;align-items:baseline;gap:12px;margin:0 2px 8px}
  .top .n{font-family:var(--mono);font-size:11px;color:var(--ink-4);text-transform:uppercase;letter-spacing:.12em}
  .top .pct{margin-left:auto;font-family:var(--mono);font-size:11px;color:var(--ink-4)}
  .stage{display:grid}
  .stage > svg{grid-area:1/1;transition:opacity .28s ease;opacity:1}
  .stage > svg.off{opacity:0;pointer-events:none}
  .mini{cursor:pointer}

  .mini text{font-family:var(--mono);font-size:9.5px;letter-spacing:.14em;fill:var(--ink-3)}
  .mini path.mch{fill:rgba(255,255,255,.07);stroke:rgba(255,255,255,.4);stroke-width:.8}
  .mini path.mh{fill:rgba(94,234,212,.12);stroke:rgba(94,234,212,.5);stroke-width:.8}
  .mini path.mh.cur{fill:rgba(94,234,212,.55);stroke:#99f6e4}
  .hint{color:var(--ink-5);font-size:10px;font-family:var(--mono);letter-spacing:.1em;text-transform:uppercase}
  .rhead{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;margin:0 2px 10px}
  .rhead h3{font-family:var(--head);font-size:20px;font-weight:600;letter-spacing:-.01em;margin:0;color:var(--ink)}
  .rhead .n{font-family:var(--mono);font-size:11px;color:var(--ink-4);text-transform:uppercase;letter-spacing:.12em}
  .rhead .pct{margin-left:auto;font-family:var(--mono);font-size:11px;color:var(--ink-4)}
  .rsub{font-size:13px;color:var(--ink-3);font-weight:300;margin:0 2px 12px;line-height:1.6}
  .bar{height:6px;border-radius:9999px;background:rgba(255,255,255,.05);overflow:hidden;margin:0 2px 14px}
  .bar i{display:block;height:100%;border-radius:9999px;background:linear-gradient(90deg,var(--done),#2dd4bf)}
  .frame{border:1px solid var(--line);border-radius:12px;overflow:hidden;background:rgba(0,0,0,.18)}
  .tip{position:fixed;pointer-events:none;background:rgba(15,23,42,.94);backdrop-filter:blur(12px);border:1px solid var(--line-2);color:#fff;border-radius:10px;padding:9px 11px;font-size:12.5px;line-height:1.4;max-width:330px;box-shadow:0 10px 30px rgba(0,0,0,.45);opacity:0;transform:translateY(4px);transition:opacity .12s,transform .12s;z-index:5}
  .tip.show{opacity:1;transform:none}
  .tip b{font-family:var(--head);font-size:14px;display:block;margin-bottom:3px;font-weight:600}
  .tip .st{display:inline-block;font-family:var(--mono);font-size:10px;text-transform:uppercase;letter-spacing:.1em;padding:1px 6px;border-radius:4px;margin:2px 0 5px}
  .tip .st.done{background:var(--done)} .tip .st.todo{background:#334155}
  .tip .row{font-family:var(--mono);font-size:11px;color:var(--ink-3)} .tip .row b{display:inline;font:inherit;color:#fff}
  /* peaks */
  .peak{cursor:pointer}
  .peak path.tri{stroke-linejoin:round}
  .peak.done path.tri{fill:var(--done);stroke:var(--done-glow);stroke-width:1.2;filter:drop-shadow(0 0 5px rgba(94,234,212,.55))}
  .peak.todo path.tri{fill:var(--halo);stroke:var(--todo);stroke-width:1.4}
  .peak path.halo{fill:transparent}
  .peak text{font-size:10.5px;fill:var(--ink-3);paint-order:stroke;stroke:var(--halo);stroke-width:3px;stroke-linejoin:round;pointer-events:none;font-weight:500}
  .peak.done text{fill:#e2e8f0;font-weight:600}
  .peak.todo text{fill:var(--ink-4)}
  .peak text .h{font-family:var(--mono);font-size:9px;font-weight:400;fill:var(--ink-4)}
  .peak.hover path.tri{stroke:#fff;stroke-width:2}
  .peak line.leader{stroke:var(--ink-3);stroke-width:.8;opacity:.8}
  .hull{cursor:pointer}
  .hull path{fill:rgba(94,234,212,.055);stroke:rgba(94,234,212,.45);stroke-width:1.1;stroke-dasharray:4 3;transition:fill .15s}
  .hull:hover path{fill:rgba(94,234,212,.12)}
  .hull text.t{font-family:var(--mono);font-size:10.5px;letter-spacing:.2em;text-transform:uppercase;fill:#99f6e4;font-weight:700;paint-order:stroke;stroke:var(--halo);stroke-width:3px}
  .hull text.s{font-family:var(--mono);font-size:9.5px;letter-spacing:.12em;fill:var(--ink-3);paint-order:stroke;stroke:var(--halo);stroke-width:3px}
  .hull line{stroke:rgba(94,234,212,.45);stroke-width:.8}
  .citylabel{font-size:9px;fill:var(--ink-5);pointer-events:none;letter-spacing:.12em;font-family:var(--mono)}
  .city{fill:var(--ink-5)}
  .ctry{font-size:9px;fill:rgba(148,163,184,.45);letter-spacing:.24em;font-family:var(--mono);pointer-events:none}
</style>

<script>
(function(){
  const D = JSON.parse(document.getElementById('data').textContent);
  const P = D.peaks, EX = D.extras;
  const NS = 'http://www.w3.org/2000/svg';
  const el = (n, a, parent) => { const e = document.createElementNS(NS, n); for (const q in a) e.setAttribute(q, a[q]); parent.appendChild(e); return e; };
  const hit = (a,b) => !(a.x+a.w<b.x || b.x+b.w<a.x || a.y+a.h<b.y || b.y+b.h<a.y);
  const segHitsBox = (x1,y1,x2,y2,b) => { for (let t=0;t<=1;t+=.1){ const x=x1+(x2-x1)*t, y=y1+(y2-y1)*t; if (x>=b.x&&x<=b.x+b.w&&y>=b.y&&y<=b.y+b.h) return true; } return false; };
  const tri = (x,y,r) => `M${x.toFixed(1)} ${(y-r*1.05).toFixed(1)}L${(x+r).toFixed(1)} ${(y+r*0.75).toFixed(1)}L${(x-r).toFixed(1)} ${(y+r*0.75).toFixed(1)}Z`;
  const nodes = {};   // key -> [g, g, ...] across maps
  const reg = (k,g) => (nodes[k] = nodes[k] || []).push(g);

  function proj(bb, W, H){
    const k = Math.cos((bb.y0+bb.y1)/2*Math.PI/180);
    const S = Math.min(W/((bb.x1-bb.x0)*k), H/(bb.y1-bb.y0));
    const ox = (W - (bb.x1-bb.x0)*k*S)/2, oy = (H - (bb.y1-bb.y0)*S)/2;
    return {X: lon => ox + (lon-bb.x0)*k*S, Y: lat => oy + (bb.y1-lat)*S, S};
  }
  function paths(pr){
    const ring = r => r.map((c,i)=>(i?'L':'M')+pr.X(c[0]).toFixed(1)+' '+pr.Y(c[1]).toFixed(1)).join('')+'Z';
    const poly = g => g.type==='Polygon' ? g.coordinates.map(ring).join('') : g.type==='MultiPolygon' ? g.coordinates.map(p=>p.map(ring).join('')).join('') : g.type==='GeometryCollection' ? g.geometries.map(poly).join('') : '';
    const one = l => l.map((c,i)=>(i?'L':'M')+pr.X(c[0]).toFixed(1)+' '+pr.Y(c[1]).toFixed(1)).join('');
    const line = g => g.type==='LineString' ? one(g.coordinates) : g.type==='MultiLineString' ? g.coordinates.map(one).join('') : '';
    return {poly, line};
  }

  // ---- shared basemap (precise swisstopo border; everything outside CH stays dark)
  function basemap(svg, id, bb, W, H, L, cities, reserve){
    svg.setAttribute('viewBox', `0 0 ${W} ${H}`);
    const pr = proj(bb, W, H), {poly, line} = paths(pr);
    const defs = el('defs', {}, svg);
    const fl = el('filter', {id:`glow-${id}`, x:'-10%', y:'-10%', width:'120%', height:'120%'}, defs); el('feGaussianBlur', {stdDeviation:16}, fl);
    const cc = el('clipPath', {id:`ch-${id}`}, defs); el('path', {d:poly(L.ch)}, cc);
    const g0 = el('g', {}, svg);
    el('path', {d:poly(L.ch), fill:'rgba(94,234,212,.05)', filter:`url(#glow-${id})`}, g0);
    el('path', {d:poly(L.ch), fill:'var(--land)'}, g0);
    const gc = el('g', {'clip-path':`url(#ch-${id})`}, g0);
    L.cantons.forEach(g => el('path', {d:poly(g), fill:'none', stroke:'var(--canton)', 'stroke-width':.9}, gc));
    L.rivers.forEach(g => el('path', {d:line(g), fill:'none', stroke:'var(--river)', 'stroke-width':1.2, 'stroke-linejoin':'round', 'stroke-linecap':'round'}, gc));
    L.lakes.forEach(g => el('path', {d:poly(g), fill:'var(--water)', stroke:'var(--water-line)', 'stroke-width':.6}, g0));
    el('path', {d:poly(L.ch), fill:'none', stroke:'var(--border)', 'stroke-width':1.4, 'stroke-linejoin':'round'}, g0);
    const boxes = reserve ? [reserve] : [];
    const gcity = el('g', {}, svg);
    cities.forEach(([n,la,lo]) => {
      const x = pr.X(lo), y = pr.Y(la), w = 8+n.length*6.4;
      if (x<10||x+w>W-10||y<10||y>H-10) return;
      const bx = {x:x-3,y:y-8,w,h:14}; if (boxes.some(b=>hit(b,bx))) return;
      el('rect', {x:x-2.2,y:y-2.2,width:4.4,height:4.4,class:'city',transform:`rotate(45 ${x} ${y})`}, gcity);
      el('text', {x:x+6,y:y+3.5,class:'citylabel'}, gcity).textContent = n.toUpperCase();
      boxes.push(bx);
    });
    return {pr, poly, boxes};
  }

  // ---- place peaks + labels on a map
  function drawPeaks(svg, pr, list, opts, boxes){
    const W = +svg.getAttribute('viewBox').split(' ')[2], H = +svg.getAttribute('viewBox').split(' ')[3];
    const gp = el('g', {}, svg);
    const pts = list.map(p => ({p, x: pr.X(p.lon), y: pr.Y(p.lat), r: opts.r(p)}));
    const own = new Map();
    pts.forEach(q => { const b = {x:q.x-q.r-2,y:q.y-q.r-2,w:2*q.r+4,h:2*q.r+4}; boxes.push(b); own.set(q, b); });
    [...pts].sort((a,b)=>a.p.h-b.p.h).forEach(q => {
      const g = el('g', {class:`peak ${q.p.status}`, 'data-key':q.p.key}, gp);
      el('path', {d:tri(q.x,q.y,q.r+3), class:'halo'}, g);
      el('path', {d:tri(q.x,q.y,q.r), class:'tri'}, g);
      q.g = g; reg(q.p.key, g);
    });
    const placed = [], h = 11;
    const order = pts.filter(q => opts.label(q.p)).sort((a,b)=> (b.p.status==='done')-(a.p.status==='done') || b.p.h-a.p.h);
    order.forEach(q => {
      const txt = opts.text(q.p), w = txt.length*5.6 + (opts.heights ? 34 : 0);
      const ob = own.get(q);
      const tryBox = (lx, by, an, leaderFrom) => {
        const bx = an==='start'? lx : an==='end'? lx-w : lx-w/2;
        const box = {x:bx-1,y:by-h+1,w:w+2,h:h+1};
        if (box.x<4||box.y<4||box.x+box.w>W-4||box.y+box.h>H-4) return false;
        const big = {x:box.x-4,y:box.y-3,w:box.w+8,h:box.h+6};
        if (placed.some(b=>hit(b,box)) || boxes.some(b=>b!==ob && hit(b,big))) return false;
        if (leaderFrom && boxes.some(b => b!==ob && segHitsBox(leaderFrom[0],leaderFrom[1],lx,by-4,b))) return false;
        if (leaderFrom) el('line', {x1:leaderFrom[0].toFixed(1), y1:leaderFrom[1].toFixed(1), x2:lx.toFixed(1), y2:(by-3.5).toFixed(1), class:'leader'}, q.g);
        const t = el('text', {x:lx.toFixed(1), y:by.toFixed(1), 'text-anchor':an}, q.g);
        t.appendChild(document.createTextNode(txt));
        if (opts.heights) { const s = el('tspan', {class:'h', dx:'5'}, t); s.textContent = q.p.h.toLocaleString('en-US'); }
        placed.push(box); return true;
      };
      const {x, y, r} = q;
      const direct = [[x+r+4, y+3.8, 'start'], [x-r-4, y+3.8, 'end'], [x, y-r-4, 'middle'], [x, y+r+11, 'middle'],
                      [x+r+3, y-r, 'start'], [x-r-3, y-r, 'end'], [x+r+3, y+r+7, 'start'], [x-r-3, y+r+7, 'end']];
      for (const [lx,by,an] of direct) if (tryBox(lx,by,an,null)) return;
      const maxLead = q.p.status==='done' ? opts.leadDone : opts.lead;
      for (let dist = 14; dist <= maxLead; dist += 6) for (let a=0;a<360;a+=15) {
        const rad = a*Math.PI/180, lx = x + Math.cos(rad)*dist, ly = y - Math.sin(rad)*dist;
        const an = Math.cos(rad) > .3 ? 'start' : Math.cos(rad) < -.3 ? 'end' : 'middle';
        const tx = an==='start'? lx+2 : an==='end'? lx-2 : lx;
        const by = ly + (an==='middle' ? (Math.sin(rad)>0 ? -2 : h+2) : 3.8);
        if (tryBox(tx, by, an, [x+Math.cos(rad)*(r+1.5), y-Math.sin(rad)*(r+1.5)])) return;
      }
    });
    return pts;
  }

  const W = 1160, H = 760;
  const regions = {pennine: 'Pennine Alps', bernese: 'Bernese Alps'};
  const stats = id => { const l = P.filter(p=>p.region===id); return [l.filter(p=>p.status==='done').length, l.length]; };
  let show = () => {};

  // ---- 1. overview: whole Switzerland
  {
    const svg = document.getElementById('m-main');
    const {pr, poly, boxes} = basemap(svg, 'main', D.frames.main, W, H, D.main,
      [['Genève',46.204,6.143],['Lausanne',46.520,6.633],['Bern',46.948,7.447],['Basel',47.559,7.588],['Zürich',47.377,8.541],['Luzern',47.050,8.306],['St. Gallen',47.424,9.377],['Chur',46.850,9.532],['Lugano',46.005,8.951],['Sion',46.233,7.360]]);
    [['FRANCE',46.05,6.30],['ITALIA',45.86,8.55],['DEUTSCHLAND',47.74,8.30],['ÖSTERREICH',47.30,10.05]].forEach(([n,la,lo]) => el('text', {x:pr.X(lo), y:pr.Y(la), class:'ctry'}, svg).textContent = n);
    [['pennine', [7.62, 45.815], 'middle'], ['bernese', [8.20, 46.575], 'start']].forEach(([id, at, an]) => {
      const [nd, n] = stats(id);
      const g = el('g', {class:'hull', role:'button', 'aria-label':`Zoom to ${regions[id]}`}, svg);
      el('path', {d:poly(D.hulls[id])}, g);
      const lx = pr.X(at[0]), ly = pr.Y(at[1]);
      el('text', {x:lx, y:ly, class:'t', 'text-anchor':an}, g).textContent = regions[id];
      el('text', {x:lx, y:ly+14, class:'s', 'text-anchor':an}, g).textContent = `${nd} / ${n} done · click to zoom`;
      boxes.push({x: an==='middle'? lx-90 : lx-2, y: ly-12, w: 190, h: 30});
      g.addEventListener('click', () => show(id));
    });
    const inRegion = p => p.region in regions;
    drawPeaks(svg, pr, [...P, ...EX], {
      r: p => inRegion(p) ? 3.6 : 6.5, label: p => !inRegion(p), text: p => p.label, heights: true, lead: 40, leadDone: 40,
    }, boxes);
    // clicks on the small triangles inside a region also zoom
    P.filter(inRegion).forEach(p => (nodes[p.key]||[]).forEach(g => g.addEventListener('click', () => show(p.region))));
  }

  // ---- mini Switzerland (top-left of each regional view) — click to go back
  function mini(svg, cur){
    const MW = 220, MH = 150, MX = 14, MY = 14;
    const g = el('g', {class:'mini', role:'button', 'aria-label':'Back to Switzerland'}, svg);
    el('rect', {x:MX, y:MY, width:MW, height:MH, rx:10, class:'card'}, g);
    el('text', {x:MX+12, y:MY+19}, g).textContent = '‹ SWITZERLAND';
    const mp = proj(D.frames.main, MW-20, MH-38), {poly} = paths({X: lon => MX+10+mp.X(lon), Y: lat => MY+28+mp.Y(lat)});
    el('path', {d:poly(D.mini.ch), class:'mch'}, g);
    Object.keys(regions).forEach(id => {
      const h = el('path', {d:poly(D.hulls[id]), class:'mh'+(id===cur?' cur':'')}, g);
      if (id !== cur) h.addEventListener('click', e => { e.stopPropagation(); show(id); });
    });
    g.addEventListener('click', () => show('main'));
    return {x:MX-6, y:MY-6, w:MW+12, h:MH+12};
  }

  // ---- 2 & 3. regional views
  const sections = {
    pennine: {cities:[['Zermatt',46.0207,7.7491],['Saas-Fee',46.1091,7.9297],['Zinal',46.1358,7.6264],['Arolla',46.0272,7.4831],['Randa',46.0994,7.7811],['Bourg-St-Pierre',45.9500,7.2083],['Macugnaga',45.9689,7.9669],['Breuil-Cervinia',45.9333,7.6300],['Sion',46.2331,7.3606],['Visp',46.2937,7.8817]],
              ctry:[['ITALIA',45.895,7.45]]},
    bernese: {cities:[['Grindelwald',46.6244,8.0411],['Wengen',46.6083,7.9225],['Fiesch',46.4000,8.1353],['Jungfraujoch',46.5475,7.9853],['Konkordiaplatz',46.5000,8.0530]],
              ctry:[]},
  };
  Object.entries(sections).forEach(([id, s]) => {
    const svg = document.getElementById('m-'+id);
    svg.setAttribute('viewBox', `0 0 ${W} ${H}`);
    const {pr, boxes} = basemap(svg, id, D.frames[id], W, H, D[id], s.cities, {x:0, y:0, w:250, h:180});
    s.ctry.forEach(([n,la,lo]) => el('text', {x:pr.X(lo), y:pr.Y(la), class:'ctry'}, svg).textContent = n);
    const R = h => 5 + (Math.min(Math.max(h,4000),4650)-4000)/650*3.5;
    drawPeaks(svg, pr, P.filter(p=>p.region===id), {
      r: p => R(p.h), label: p => p.dlabel, text: p => p.label, heights: false, lead: id==='bernese' ? 44 : 26, leadDone: 50,
    }, boxes);
    mini(svg, id);
  });

  // ---- view switching
  const count = document.getElementById('count');
  show = v => {
    ['main','pennine','bernese'].forEach(k => document.getElementById('m-'+k).classList.toggle('off', k!==v));
    document.getElementById('tip').classList.remove('show');
    if (v === 'main') count.textContent = 'Click a region to zoom in';
    else { const [a, b] = stats(v); count.textContent = `${regions[v]} · ${a} / ${b} complete`; }
    try { history.replaceState(null, '', v==='main' ? location.pathname + location.search : '#'+v); } catch(e) {}
  };
  show(regions[location.hash.slice(1)] ? location.hash.slice(1) : 'main');
  document.addEventListener('keydown', e => { if (e.key === 'Escape') show('main'); });

  // ---- interaction
  const tip = document.getElementById('tip');
  const statusName = {done:'Done', todo:'Remaining'};
  const regionName = {pennine:'Pennine Alps', bernese:'Bernese Alps', bernina:'Bernina', outside:'outside Switzerland'};
  function showTip(p, e){
    const rows = [];
    if (p.year) rows.push(`<div class="row">summited <b>${p.year}</b>${p.type?` · ${p.type.toLowerCase()}`:''}</div>`);
    if (p.grade) rows.push(`<div class="row">grade <b>${p.grade}</b>${p.gain?` · <b>${p.gain.toLocaleString('en-US')} m</b> gain`:''}</div>`);
    if (p.note) rows.push(`<div class="row">${p.note}</div>`);
    const meta = p.rank ? `${p.h.toLocaleString('en-US')} m · ${regionName[p.region]} · #${p.rank} of 48` : `${p.h.toLocaleString('en-US')} m · ${p.group}`;
    tip.innerHTML = `<b>${p.name}</b><span class="st ${p.status}">${statusName[p.status]}</span><div class="row">${meta}</div>${rows.join('')}`;
    tip.classList.add('show'); moveTip(e);
  }
  function moveTip(e){
    let x = e.clientX + 14, y = e.clientY + 14;
    if (x + tip.offsetWidth > innerWidth - 8) x = e.clientX - tip.offsetWidth - 14;
    if (y + tip.offsetHeight > innerHeight - 8) y = e.clientY - tip.offsetHeight - 14;
    tip.style.left = x+'px'; tip.style.top = y+'px';
  }
  const all = [...P, ...EX];
  all.forEach(p => (nodes[p.key]||[]).forEach(g => {
    g.addEventListener('mouseenter', e => { nodes[p.key].forEach(x => { x.classList.add('hover'); x.parentNode.appendChild(x); }); showTip(p, e); });
    g.addEventListener('mousemove', moveTip);
    g.addEventListener('mouseleave', () => { nodes[p.key].forEach(x => x.classList.remove('hover')); tip.classList.remove('show'); });
  }));
  const on = {done:true, todo:true};
  document.querySelectorAll('#legend button').forEach(b => b.addEventListener('click', () => {
    const s = b.dataset.s; on[s] = !on[s]; b.classList.toggle('off', !on[s]);
    all.forEach(p => (nodes[p.key]||[]).forEach(g => g.style.display = on[p.status] ? '' : 'none'));
  }));

  document.addEventListener('pointerdown', e => {
    if (!e.target.closest('.peak') && !e.target.closest('#legend') && !e.target.closest('.hull') && !e.target.closest('.mini')) {
      const t = document.getElementById('tip');
      if (t) t.classList.remove('show');
    }
  });
})();
</script>
</body>
</html>
