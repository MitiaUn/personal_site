<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Project Passes</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#020617; --card:rgba(0,0,0,.28); --line:rgba(255,255,255,.06); --line-2:rgba(255,255,255,.10);
    --ink:#f1f5f9; --ink-2:#cbd5e1; --ink-3:#94a3b8; --ink-4:#64748b; --ink-5:#475569;
    --land:rgba(255,255,255,.045); --neigh:rgba(255,255,255,.015); --canton:rgba(255,255,255,.07); --border:rgba(255,255,255,.32);
    --water:#16294a; --water-line:#2a4a75; --river:#22395c; --halo:#070b18;
    --done:#0d9488; --done-glow:#5eead4; --planned:#d97706; --planned-glow:#fcd34d; --todo:#64748b;
    --font:"Inter",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif; --head:"Outfit",var(--font);
    --mono:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,"Liberation Mono","Courier New",monospace;
  }
  *{box-sizing:border-box}
  html,body{margin:0;color:var(--ink);font-family:var(--font);-webkit-font-smoothing:antialiased;overflow:hidden;background-color:#020617}
  body{background-color:#020617}
  body.poster{background-color:#020617}
  .wrap{margin:0;padding:0}
  .kicker{font-family:var(--mono);font-size:11px;text-transform:uppercase;letter-spacing:.2em;color:var(--ink-3);margin:0 0 10px;font-weight:700}
  header{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:10px 24px;margin-bottom:12px}
  h1{font-family:var(--head);font-size:30px;letter-spacing:-.02em;margin:0 0 6px;font-weight:700;color:var(--ink)}
  .sub{color:var(--ink-3);font-size:14px;line-height:1.6;margin:0;font-weight:300;max-width:62ch}
  .stats{display:flex;gap:22px;align-items:flex-end;flex-wrap:wrap}
  .stat{display:flex;flex-direction:column;min-width:56px}
  .stat b{font-family:var(--head);font-size:24px;font-weight:600;line-height:1.05;font-variant-numeric:tabular-nums;color:var(--ink)}
  .stat span{font-family:var(--mono);font-size:10px;color:var(--ink-4);text-transform:uppercase;letter-spacing:.12em;margin-top:5px}
  .bar{display:flex;height:6px;border-radius:9999px;overflow:hidden;background:rgba(255,255,255,.05);margin:12px 0 18px;gap:2px}
  .bar i{display:block;height:100%;border-radius:9999px}
  .bar .d{background:linear-gradient(90deg,var(--done),#2dd4bf)} .bar .p{background:var(--planned)} .bar .t{background-color:#020617}
  .card{background-color:#020617;border:0;border-radius:0;padding:0;position:relative}
  svg.map{display:block;width:100%;height:auto;border-radius:12px}
  .legend{display:flex;gap:6px;flex-wrap:wrap;align-items:center;padding:6px 2px 0;font-size:12px;color:var(--ink-3)}
  .legend button{appearance:none;border:0;background-color:#020617;font:inherit;color:inherit;display:inline-flex;align-items:center;gap:8px;padding:5px 9px;border-radius:9999px;cursor:pointer;border:1px solid transparent;transition:all .2s}
  .legend button:hover{background:rgba(255,255,255,.05);border-color:var(--line-2)}
  .legend button.off{opacity:.35;text-decoration:line-through}
  .legend .sw{width:11px;height:11px;border-radius:50%;display:inline-block;border:2px solid transparent}
  .legend .sw.d{background:var(--done);border-color:var(--done);box-shadow:0 0 8px rgba(94,234,212,.6)}
  .legend .sw.p{background:var(--planned);border-color:var(--planned)}
  .legend .sw.t{background-color:#020617;border-color:var(--todo)}
  .legend .hint{margin-left:auto;color:var(--ink-4);font-size:10px;font-family:var(--mono);letter-spacing:.12em;text-transform:uppercase}
  .tip{position:absolute;pointer-events:none;background:rgba(15,23,42,.92);backdrop-filter:blur(12px);border:1px solid var(--line-2);color:#fff;border-radius:10px;padding:9px 11px;font-size:12.5px;line-height:1.4;max-width:270px;box-shadow:0 10px 30px rgba(0,0,0,.45);opacity:0;transform:translateY(4px);transition:opacity .12s,transform .12s;z-index:5}
  .tip.show{opacity:1;transform:none}
  .tip b{font-family:var(--head);font-size:14px;display:block;margin-bottom:3px;font-weight:600}
  .tip .st{display:inline-block;font-family:var(--mono);font-size:10px;text-transform:uppercase;letter-spacing:.1em;padding:1px 6px;border-radius:4px;margin:2px 0 5px}
  .tip .st.done{background:var(--done)} .tip .st.planned{background:var(--planned)} .tip .st.todo{background:#334155}
  .tip table{border-collapse:collapse;margin-top:4px;font-family:var(--mono);font-size:11px} .tip td{padding:1px 9px 1px 0;color:var(--ink-3);white-space:nowrap} .tip td:first-child{color:#fff}
  /* map marks */
  .pass{cursor:pointer}
  .pass circle.core{stroke:var(--halo);stroke-width:1.5}
  .pass.done circle.core{fill:var(--done);stroke:var(--done-glow);stroke-width:1.2;filter:drop-shadow(0 0 5px rgba(94,234,212,.55))}
  .pass.planned circle.core{fill:var(--planned);stroke:var(--planned-glow);stroke-width:1.2}
  .pass.todo circle.core{fill:var(--halo);stroke:var(--todo);stroke-width:1.8}
  .pass circle.halo{fill:transparent}
  .pass text{font-size:10px;fill:var(--ink-3);paint-order:stroke;stroke:var(--halo);stroke-width:3px;stroke-linejoin:round;pointer-events:none;font-weight:500}
  .pass.done text{fill:#e2e8f0;font-weight:600}
  .pass.planned text{fill:#fcd34d;font-weight:500}
  .pass.todo text{fill:var(--ink-4)}
  .pass.hover circle.core,.pass.hl circle.core{stroke:#fff;stroke-width:2.2}
  .pass.dim{opacity:.12}
  .pass line.leader{stroke:var(--ink-4);stroke-width:.7;opacity:.7}
  .lakelabel{font-size:9.5px;fill:#3f6795;font-style:italic;pointer-events:none}
  .citylabel{font-size:9px;fill:var(--ink-5);pointer-events:none;letter-spacing:.12em;font-family:var(--mono)}
  .city{fill:var(--ink-5)}
  /* list */
  .lists{display:grid;grid-template-columns:1fr 1fr;gap:18px 32px;margin-top:22px}
  .col h3{font-family:var(--mono);font-size:11px;text-transform:uppercase;letter-spacing:.16em;color:var(--ink-4);margin:0 0 10px;display:flex;align-items:center;gap:8px;font-weight:700}
  .col h3 .n{color:var(--ink-2)}
  .col ul{list-style:none;margin:0;padding:0}
  .col li{display:flex;align-items:center;gap:10px;font-size:14px;padding:5px 8px;border-radius:8px;cursor:default;font-variant-numeric:tabular-nums;transition:background .15s}
  .col li:hover{background:rgba(255,255,255,.05)}
  .col li .ic{width:14px;height:14px;flex:none;display:inline-flex;align-items:center;justify-content:center}
  .col li .ic svg{width:14px;height:14px}
  .col li .nm{flex:1;color:var(--ink)}
  .col li .alt{color:var(--ink-5);font-family:var(--mono);font-size:10px}
  .col li .yr{color:var(--ink-4);font-size:11px;margin-left:7px;font-family:var(--mono)}
  .col li.sub{opacity:.5}
  footer{margin-top:20px;font-size:12px;color:var(--ink-5);line-height:1.6;font-weight:300}
    @media (max-width:560px){.lists{grid-template-columns:1fr}.stat b{font-size:20px}h1{font-size:24px}}
  body.poster .legend,body.poster .lists,body.poster footer,body.poster header,body.poster .bar,body.poster .kicker{display:none}
  body.poster .wrap{padding:0;max-width:none} body.poster .card{background-color:#020617;border:0;padding:0;backdrop-filter:none}
</style>
</head>

  </div>

<script>
(function(){
  const D = JSON.parse(document.getElementById('data').textContent);

  if (poster) document.body.classList.add('poster');

  // ---- projection: equirectangular with standard parallel at 46.8° (near-conformal at this scale)
  const W = 1160, H = 760, PAD = 18;
  const k = Math.cos(46.8*Math.PI/180);
  const bb = {x0:5.93,x1:10.56,y0:45.80,y1:47.82}; // Switzerland
  const sx = (W-2*PAD)/((bb.x1-bb.x0)*k), sy = (H-2*PAD)/(bb.y1-bb.y0);
  const S = Math.min(sx, sy);
  const ox = (W - (bb.x1-bb.x0)*k*S)/2, oy = (H - (bb.y1-bb.y0)*S)/2;
  const X = lon => ox + (lon-bb.x0)*k*S;
  const Y = lat => oy + (bb.y1-lat)*S;

  const svg = document.getElementById('map');
  svg.setAttribute('viewBox', `0 0 ${W} ${H}`);

  function polyPath(g){
    if (g.type==='Polygon') return g.coordinates.map(ringPath).join('');
    if (g.type==='MultiPolygon') return g.coordinates.map(p=>p.map(ringPath).join('')).join('');
    return '';
  }
  function linePath(g){
    const one = l => l.map((c,i)=>(i?'L':'M')+X(c[0]).toFixed(1)+' '+Y(c[1]).toFixed(1)).join('');
    if (g.type==='LineString') return one(g.coordinates);
    if (g.type==='MultiLineString') return g.coordinates.map(one).join('');
    return '';
  }

  const chClip = el('clipPath', {id:'chclip'}, defs); el('path', {d:polyPath(D.ch)}, chClip);

  const gc = el('g', {'clip-path':'url(#chclip)'}, g0);

  // cities for orientation
  const cities = [['Genève',46.204,6.143],['Lausanne',46.520,6.633],['Bern',46.948,7.447],['Basel',47.559,7.588],['Zürich',47.377,8.541],['Luzern',47.050,8.306],['St. Gallen',47.424,9.377],['Chur',46.850,9.532],['Lugano',46.005,8.951],['Sion',46.233,7.360]];
  const gcity = el('g', {});
  cities.forEach(([n,la,lo]) => {
    el('rect', {x:X(lo)-2.2,y:Y(la)-2.2,width:4.4,height:4.4,class:'city',transform:`rotate(45 ${X(lo)} ${Y(la)})`}, gcity);
    el('text', {x:X(lo)+6,y:Y(la)+3.5,class:'citylabel'}, gcity).textContent = n.toUpperCase();
  });
  const lakeLabels = [['Léman',46.42,6.55,-12],['Neuchâtel',46.90,6.86,-38],['Bodensee',47.62,9.38,0],['Zürichsee',47.27,8.66,-32],['Vierwaldstättersee',46.99,8.45,0],['Thunersee',46.68,7.72,0],['Maggiore',46.03,8.73,0],['Walensee',47.10,9.24,0],['Bielersee',47.10,7.19,-38]];
  const lakeBoxes = [];
  lakeLabels.forEach(([n,la,lo,rot]) => { const t = el('text',{x:X(lo),y:Y(la),class:'lakelabel','text-anchor':'middle',transform:`rotate(${rot} ${X(lo)} ${Y(la)})`}, gcity); t.textContent = n; const w=n.length*5.2; lakeBoxes.push({x:X(lo)-w/2,y:Y(la)-9,w:w,h:12}); });

  // ---- passes
  const R = a => 4 + (Math.min(Math.max(a,900),2500)-900)/1600*4.5;   // 4 → 8.5 px by altitude
  const gp = el('g', {});
  const placed = []; // label boxes for collision
  const boxes = [];  // marker boxes (circles) to keep labels off
  P.forEach(p => { p.x = X(p.lon); p.y = Y(p.lat); p.r = R(p.alt); boxes.push({x:p.x-p.r-2,y:p.y-p.r-2,w:2*p.r+4,h:2*p.r+4}); });
  cities.forEach(([n,la,lo]) => boxes.push({x:X(lo)-3,y:Y(la)-8,w:8+n.length*6.4,h:14}));
  lakeBoxes.forEach(b=>boxes.push(b));
  const hit = (a,b) => !(a.x+a.w<b.x || b.x+b.w<a.x || a.y+a.h<b.y || b.y+b.h<a.y);
  const nodes = {};
  // label priority: done first (they are the story), then altitude
  const order = [...P].sort((a,b)=> (b.status==='done')-(a.status==='done') || b.alt-a.alt);
  P.forEach(p => {
    const g = el('g', {class:`pass ${p.status}`, 'data-key':p.key}, gp);
    el('circle', {cx:p.x, cy:p.y, r:Math.max(p.r+6,11), class:'halo'}, g);
    el('circle', {cx:p.x, cy:p.y, r:p.r, class:'core'}, g);
    nodes[p.key] = g;
  });
  const fontW = s => s.length*5.35;
  order.forEach(p => {
    const g = nodes[p.key];
    const w = fontW(p.name), h = 11;
    const cands = [
      [p.x+p.r+4, p.y+3.8, 'start'], [p.x-p.r-4, p.y+3.8, 'end'],
      [p.x, p.y-p.r-4, 'middle'], [p.x, p.y+p.r+11, 'middle'],
      [p.x+p.r+3, p.y-p.r-1, 'start'], [p.x-p.r-3, p.y+p.r+8, 'end'],
    ];
    for (const [x,y,an] of cands) {
      const bx = an==='start'? x : an==='end'? x-w : x-w/2;
      const box = {x:bx-1,y:y-h+1,w:w+2,h:h+1};
      if (box.x<2||box.y<2||box.x+box.w>W-2||box.y+box.h>H-2) continue;
      if (placed.some(b=>hit(b,box)) || boxes.some(b=>hit(b,box))) continue;
      const t = el('text', {x:x.toFixed(1), y:y.toFixed(1), 'text-anchor':an}, g); t.textContent = p.name;
      placed.push(box); p.labeled = true; break;
    }
    if (p.labeled) return;
    // second ring: push the label out and connect it with a thin leader
    const dirs = [];
    for (let a=0;a<360;a+=10) dirs.push(a*Math.PI/180);
    outer: for (const dist of [22, 30, 40, 52, 64, 78, 92, 108, 124]) {
      for (const a of dirs) {
        const lx = p.x + Math.cos(a)*dist, ly = p.y - Math.sin(a)*dist;
        const an = Math.cos(a) > .3 ? 'start' : Math.cos(a) < -.3 ? 'end' : 'middle';
        const bx = an==='start'? lx+2 : an==='end'? lx-2-w : lx-w/2;
        const by = ly + (an==='middle' ? (Math.sin(a)>0 ? -2 : h+2) : 3.8);
        const box = {x:bx-1,y:by-h+1,w:w+2,h:h+1};
        if (box.x<2||box.y<2||box.x+box.w>W-2||box.y+box.h>H-2) continue;
        if (placed.some(b=>hit(b,box)) || boxes.some(b=>hit(b,box))) continue;
        // leader must not cross other markers
        const mid = {x:Math.min(p.x,lx)-1,y:Math.min(p.y,ly)-1,w:Math.abs(lx-p.x)+2,h:Math.abs(ly-p.y)+2};
        if (dist < 100 && boxes.some(b => b!==boxes[P.indexOf(p)] && hit(b,mid) && segHitsBox(p.x,p.y,lx,ly,b))) continue;
        el('line', {x1:(p.x+Math.cos(a)*(p.r+1.5)).toFixed(1), y1:(p.y-Math.sin(a)*(p.r+1.5)).toFixed(1), x2:lx.toFixed(1), y2:ly.toFixed(1), class:'leader'}, g);
        const t = el('text', {x:(an==='start'?lx+2:an==='end'?lx-2:lx).toFixed(1), y:by.toFixed(1), 'text-anchor':an}, g); t.textContent = p.name;
        placed.push(box); p.labeled = true; break outer;
      }
    }
  });
  function segHitsBox(x1,y1,x2,y2,b){
    // sample the segment
    for (let t=0;t<=1;t+=.1){ const x=x1+(x2-x1)*t, y=y1+(y2-y1)*t; if (x>=b.x&&x<=b.x+b.w&&y>=b.y&&y<=b.y+b.h) return true; }
    return false;
  }

  // ---- count line
  const core = P.filter(p=>p.core);
  const nd = core.filter(p=>p.status==='done').length, N = core.length;
  document.getElementById('count').textContent = `${nd} / ${N} complete · ${Math.round(nd/N*100)}%`;

  // ---- interaction
  const tip = document.getElementById('tip'), card = svg.parentElement;
  const statusName = {done:'Done', todo:'Remaining'};
  function showTip(p, evt){
    const rows = p.sides.map(s=>`<tr><td>${s.side||'—'}</td><td>${s.done?(s.year||'done'):'not yet'}</td><td>${s.gain!=null?s.gain+' m':''}</td><td>${s.grad?s.grad+'%':''}</td></tr>`).join('');
    tip.innerHTML = `<b>${p.name}</b><span class="st ${p.status}">${statusName[p.status]}</span> · ${p.alt.toLocaleString('en-CH')} m${p.rank?` · #${p.rank} by altitude`:''}${p.region&&p.status!=='done'?`<div style="color:#d5d9de">near ${p.region}</div>`:''}` +
      (p.sides.some(s=>s.gain!=null||s.year)?`<table>${rows}</table>`:'');
    tip.classList.add('show');
    moveTip(evt);
  }
  function moveTip(evt){
    const r = card.getBoundingClientRect();
    let x = evt.clientX - r.left + 14, y = evt.clientY - r.top + 14;
    if (x + tip.offsetWidth > r.width - 8) x = evt.clientX - r.left - tip.offsetWidth - 14;
    if (y + tip.offsetHeight > r.height - 8) y = evt.clientY - r.top - tip.offsetHeight - 14;
    tip.style.left = x+'px'; tip.style.top = y+'px';
  }
  const hideTip = () => tip.classList.remove('show');
  const byKey = Object.fromEntries(P.map(p=>[p.key,p]));
  P.forEach(p => {
    const g = nodes[p.key];
    g.addEventListener('mouseenter', e => { g.classList.add('hover'); g.parentNode.appendChild(g); showTip(p, e); });
    g.addEventListener('mousemove', moveTip);
    g.addEventListener('mouseleave', () => { g.classList.remove('hover'); hideTip(); });
  });
  const on = {done:true, todo:true};
  document.querySelectorAll('#legend button').forEach(b => b.addEventListener('click', () => {
    const s = b.dataset.s; on[s] = !on[s]; b.classList.toggle('off', !on[s]);
    P.forEach(p => nodes[p.key].style.display = on[p.status] ? '' : 'none');
  }));

  document.addEventListener('pointerdown', e => {
    if (!e.target.closest('.lake') && !e.target.closest('.pass') && !e.target.closest('.peak') && !e.target.closest('#legend')) {
      hideTip();
    }
  });
})();
</script>
</body>
</html>
